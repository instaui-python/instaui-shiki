[project]
name = "instaui-shiki"
version = "0.7.0"
description = "A Python package for instaui-shiki."
keywords = ["ui", "gui", "web", "shiki" , "syntax-highlighting"]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "CrystalWindSnake", email = "568166495@qq.com" }
]

requires-python = ">=3.10,<3.14"

dependencies = [
    "instaui>=0.9.0",
]

[dependency-groups]
dev = [
    {include-group = "test"},
    {include-group = "web"},
    {include-group = "playwright"},
    {include-group = "lint"},
    {include-group = "git"},
]

playwright = [
    "playwright==1.57.0",
    "pytest-playwright>=0.7.1",
]

test = [
    "instaui[all]",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.24.0",
]

web = [
    "fastapi[standard]>=0.115.12",
    "uvicorn>=0.33.0",
]

git = [
    "pre-commit>=3.5.0",
]

lint = [
    "ruff==0.12.2",
]

[tool.ruff.lint]
extend-select = ["I"]

[build-system]
requires = ["uv_build>=0.11.13,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
instaui = { path = "../instaui", editable = true }